<div class="quiz-container">
    <h1>SFT Meeter</h1>
    <p>MCQ Quiz Website</p>

    <!-- 1. Timer සහ Progress Text -->
    <div class="quiz-header">
        <div id="progress">Question 1 / 10</div>
        <div id="timer-box">Time Left: <span id="timer">10:00</span></div>
    </div>

    <!-- 2. Progress Bar එක -->
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <!-- 3. ප්‍රශ්න පෙනෙන තැන -->
    <div id="quiz"></div>

    <!-- 4. ඊළඟ ප්‍රශ්නයට යන Button එක -->
    <button id="next-btn" onclick="nextQuestion()">Next Question</button>

    <!-- 5. Result එක පෙන්වන තැන (මුලින්ම මේක hide වෙලා තියෙන්නේ) -->
    <div id="result-box" style="display: none;">
        <h2>Quiz Completed!</h2>
        <div id="result"></div>
        <button onclick="location.reload()" class="restart-btn">Restart Quiz</button>
    </div>
</div>
