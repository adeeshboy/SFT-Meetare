<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFT Meeter - MCQ Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <div class="quiz-header">
            <h1>SFT Meeter</h1>
            <p class="subtitle">Science for Technology MCQ Quiz</p>
        </div>

        <div class="info-bar">
            <div id="progress">Question 1 / 10</div>
            <div id="timer-box">⏱️ <span id="timer">10:00</span></div>
        </div>

        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div id="quiz-box">
            <div id="quiz"></div>
            <button id="next-btn" onclick="nextQuestion()">Next Question ➡️</button>
        </div>

        <div id="result-box" style="display: none;">
            <h2>🎉 Quiz Completed!</h2>
            <div id="result"></div>
            <button onclick="location.reload()" class="restart-btn">🔄 Try Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
