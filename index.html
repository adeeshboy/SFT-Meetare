<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFT Meetare - MCQ Quiz</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <div id="sidebar" class="sidebar">
        <button class="close-btn" onclick="toggleMenu()">×</button>
        <div class="sidebar-logo">🔬🤖 SFT Meetare</div>
        <div class="sidebar-title">SFT Lessons</div>
        <div id="sidebar-lessons"></div>
    </div>

    <button class="menu-open-btn" onclick="toggleMenu()">☰ Menu</button>

    <div class="quiz-container">
        
        <div id="login-page">
            <h2>🔐 SFT Meetare Login</h2>
            <p class="subtitle">ඇතුළු වීමට ඔයාගේ නම සහ Password එක දාන්න</p>
            <div class="input-group">
                <input type="text" id="username" placeholder="Enter your name" required>
                <input type="password" id="password" placeholder="Enter Password (1234)" required>
            </div>
            <button onclick="checkLogin()" class="action-btn">Login 🚀</button>
            <p id="login-error" style="color: red; margin-top: 10px; display: none;">❌ වැරදි නමක් හෝ Password එකක්!</p>
        </div>

        <div id="home-page" style="display: none;">
            <div class="home-icon">🔬🤖</div>
            <h1>Welcome, <span id="user-display"></span>!</h1>
            <p class="subtitle">SFT Meetare - MCQ Challenge</p>
            
            <div id="lessons-container" class="dashboard-grid"></div>
        </div>

        <div id="quiz-page" style="display: none;">
            <div class="quiz-header">
                <h1 id="quiz-topic-title">SFT Meetare</h1>
                <div id="timer-box">⏱️ <span id="timer">10:00</span></div>
            </div>
            <div class="info-bar">
                <div id="progress">Question 1 / 10</div>
            </div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="quiz"></div>
            <button id="next-btn" onclick="nextQuestion()">Next Question ➡️</button>
            <button onclick="backToHome()" class="back-home-btn">🏠 Back to Dashboard</button>
        </div>

        <div id="result-box" style="display: none;">
            <h2>🎉 Quiz Completed!</h2>
            <div id="result"></div>
            <button onclick="backToHome()" class="restart-btn">🔄 Done & Back to Home</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
