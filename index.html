<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFT Meetare - Premium Learning Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="login-page" class="page active">
        <div class="lang-badge-fixed"><i class="fas fa-globe"></i> සිංහල මාධ්‍යය</div>
        <div class="login-card">
            <div class="lock-badge"><i class="fas fa-unlock-alt"></i></div>
            <h2>SFT Meetare Login</h2>
            <p class="tagline">🚀😍 තාක්ෂණවේදයේ මීටර්කාරයින්ගේ නිවහන</p>
            <button type="button" class="google-btn" id="google-login-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                <span>Sign in with Google</span>
            </button>
            <div class="divider"><span>OR WITH EMAIL</span></div>
            <form id="login-form">
                <div class="input-group"><input type="text" id="username" placeholder="Enter your name" required></div>
                <div class="input-group pass-group"><input type="password" id="password" placeholder="Enter Password" required><i class="far fa-eye" id="toggle-password"></i></div>
                <button type="submit" class="btn-primary" id="login-submit-btn">Login with Password 🚀</button>
            </form>
        </div>
    </div>

    <div id="home-page" class="page">
        <header class="navbar">
            <button id="menu-btn" class="menu-btn"><i class="fas fa-bars-staggered"></i></button>
            <div class="logo">SFT Meetare</div>
            <div class="user-profile">
                <img id="user-profile-pic" src="https://via.placeholder.com/150" alt="Profile">
                <span id="user-display-name">Loading...</span>
                <button id="logout-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <div id="sidebar" class="sidebar">
            <button id="close-btn" class="close-btn">&times;</button>
            <div class="sidebar-content">
                <div class="countdown-widget"><h4>2027 A/L COUNTDOWN</h4><div id="days-count">000</div></div>
            </div>
        </div>
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <main class="main-content">
            <div class="view-switcher-container">
                <button class="switch-tab-btn active" id="tab-all" onclick="switchView('all')">📄 Show All</button>
                <button class="switch-tab-btn" id="tab-syllabus" onclick="switchView('syllabus')">📚 Syllabus</button>
                <button class="switch-tab-btn" id="tab-papers" onclick="switchView('papers')">📝 Papers</button>
            </div>
            <div class="subject-filter-container" id="subject-filter-bar">
                <button class="sub-filter-btn active" onclick="filterSubject('ALL')">All Subjects</button>
                <button class="sub-filter-btn" onclick="filterSubject('MATHS')">📐 Maths</button>
                <button class="sub-filter-btn" onclick="filterSubject('PHYSICS')">🔬 Physics</button>
            </div>
            <div class="dashboard-grid-layout">
                <section class="cat-section" id="section-syllabus">
                    <h2>SFT විෂය නිර්දේශයේ පාඩම්</h2>
                    <div class="lessons-grid" id="lessons-container"></div>
                </section>
                <section class="cat-section" id="section-papers">
                    <h2>ප්‍රශ්න පත්‍ර (Papers)</h2>
                    <div class="gcse-search"></div>
                    <div class="lessons-grid" id="papers-container"></div>
                </section>
            </div>
        </main>
    </div>

    <div id="quiz-page" class="page">
        <div class="quiz-container"><h2 id="quiz-title">Quiz</h2><p id="question-text"></p><div id="options-container"></div><button id="next-btn" style="display:none;">Next</button></div>
    </div>
    <div id="result-page" class="page"><div class="result-card"><h2 id="result-text"></h2><button id="back-home-btn">Back</button></div></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
